name: Validate Configuration
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run configuration validation
        run: node scripts/validate-config.js
      - name: Run test suite
        run: node --test test/**/*.test.js
      # CE Plugin health check (optional in CI — validates config only)
      # To enable full CE validation, add: npm install -g @anthropic/ce-plugin
